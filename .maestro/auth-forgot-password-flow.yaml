appId: dev.expo.activity
---
# Auth — Forgot Password flow
# Verifies: sign-in screen → forgot password → form visible → back

- launchApp

# Navigate to sign-in screen via landing
- assertVisible: "Find My Resort"
- assertVisible: "Sign in"
- tapOn: "Sign in"

# Sign-in screen — tap "Forgot password?"
- assertVisible: "Sign in to PisteWise"
- tapOn: "Forgot password?"

# Forgot-password screen
- assertVisible: "Reset Password"
- assertVisible: "Email"
