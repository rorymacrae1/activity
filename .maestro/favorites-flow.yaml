appId: dev.expo.activity
---
# Favorites flow
# Verifies: complete onboarding → continue to app → favorites tab → empty state

- launchApp

# Complete onboarding quiz
- assertVisible: "Find My Resort"
- tapOn: "Find My Resort"

- assertVisible: "Who's this trip for?"
- tapOn: "Couple"
- tapOn: "Next"

- assertVisible: "Who's hitting the slopes?"
- tapOn: "Blue Cruiser"
- tapOn: "Next"

- assertVisible: "How do you like to ski?"
- tapOn: "Sweet Spot"
- tapOn: "Next"

- assertVisible: "Where do you want to ski?"
- tapOn: "France"
- tapOn: "Next"

- assertVisible: "What's your vibe?"
- tapOn: "See Results"

# Results screen → continue to app
- assertVisible: "Your Top Matches"
- tapOn: "Continue to App"

# Main app — navigate to Favorites tab
- tapOn: "Favorites"

# Verify empty-state when no resorts saved
- assertVisible: "No saved resorts yet"
- assertVisible: "Open any resort and tap the heart to save it for later."
- assertVisible: "Browse resorts"
