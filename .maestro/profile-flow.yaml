appId: dev.expo.activity
---
# Profile flow
# Verifies: complete onboarding → continue to app → profile tab → preferences shown

- launchApp

# Complete onboarding quiz
- assertVisible: "Find My Resort"
- tapOn: "Find My Resort"

- assertVisible: "Who's this trip for?"
- tapOn: "Couple"
- tapOn: "Next"

- assertVisible: "Who's hitting the slopes?"
- tapOn: "Blue Cruiser"
- tapOn: "Next"

- assertVisible: "How do you like to ski?"
- tapOn: "Sweet Spot"
- tapOn: "Next"

- assertVisible: "Where do you want to ski?"
- tapOn: "France"
- tapOn: "Next"

- assertVisible: "What's your vibe?"
- tapOn: "See Results"

# Results screen → continue to app
- assertVisible: "Your Top Matches"
- tapOn: "Continue to App"

# Main app — navigate to Profile tab
- tapOn: "Profile"

# Profile screen assertions
- assertVisible: "Profile"
- assertVisible: "Your Preferences"
- assertVisible: "Skill Level"
- assertVisible: "Budget"
- assertVisible: "Regions"
- assertVisible: "Actions"
- assertVisible: "Retake Quiz"
